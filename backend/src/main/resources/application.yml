spring:
  application:
    name: twisungane
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/twisungane}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

twisungane:
  jwt:
    # No hardcoded fallback: both JWT_SECRET and ENCRYPTION_SECRET_KEY are only ever read from
    # the environment now. Previously this had a hardcoded hex default that was committed to
    # git history, so anyone reading the source could forge valid JWTs or decrypt PII in any
    # deployment that forgot to set the env var. Spring now fails fast at startup instead.
    secret: ${JWT_SECRET}
    expiration: 86400000
  encryption:
    key: ${ENCRYPTION_SECRET_KEY}
  cookie:
    secure: ${COOKIE_SECURE:false}
